[package]
name = "hypern"
version = "1.1.3"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "hypern"
crate-type = ["cdylib", "staticlib"]

[dependencies]
pyo3 = { version = "0.29.2", features = ["extension-module", "generate-import-lib"] }

tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "sync", "time", "signal", "macros"] }
tokio-stream = "0.1.19"
futures-core = "0.3.33"
futures-util = "0.3.33"
socket2 = "0.6.5"

# Axum as the main web framework (built on hyper + tower)
axum = { version = "0.8.9", features = ["http2"] }
bytes = "1.12.1"
percent-encoding = "2.3.1"
serde = "1.0.229"
serde_json = "1.0.151"
form_urlencoded = "1.2.1"
mimalloc = { version = "0.1.52", optional = true }
libc = "0.2.182"
crossbeam-channel = "0.5.16"

# Performance: SIMD JSON parsing
simd-json = "0.17.3"

# Performance: Fast hashing
ahash = "0.8"
xxhash-rust = { version = "0.8.18", features = ["xxh3"] }

# URL routing
matchit = "0.9.2"

# Performance: Memory optimization
smallvec = "1.15.2"
memmap2 = "0.9.11"
bumpalo = "3.20.3"

# Performance: Concurrency
dashmap = "6.2.1"
parking_lot = "0.12.5"

# Smart String optimization
smartstring = "1.0.1"

chrono = { version = "0.4.45", features = ["serde"] }

# Utils: crypto, uuid, encoding
uuid = { version = "1.24.0", features = ["v4", "v7"] }
rand = "0.10.2"
base64 = "0.23.1"
sha2 = "0.11.0"
hmac = "0.13.0"

# JWT RS256/ES256 support
rsa = { version = "0.9.10", features = ["sha2"] }
p256 = { version = "0.14.0", features = ["ecdsa", "sha2"] }
signature = "3.0.0"

# Async HTTP client
reqwest = { version = "0.13.4", default-features = false, features = ["json", "gzip"] }
url = "2.5"

# Redis
redis = { version = "1.5.0", features = ["tokio-comp", "connection-manager"] }
deadpool-redis = "0.23.0"

# Log
pyo3-log = "0.13.4"
log = { version = "0.4", features = ["kv", "kv_std"] }

[target.'cfg(not(any(target_env = "musl", target_os = "freebsd", target_os = "openbsd", target_os = "windows")))'.dependencies]
tikv-jemallocator = { version = "0.7.0", default-features = false, features = ["disable_initial_exec_tls"] }

[build-dependencies]
pyo3-build-config = "=0.29.2"

[features]
mimalloc = ["dep:mimalloc"]

[profile.release]
codegen-units = 1
debug = false
incremental = false
lto = "fat"
opt-level = 3
panic = "abort"
strip = "debuginfo"

# Enable target-cpu=native for maximum SIMD utilization
[profile.release.build-override]
opt-level = 3

[package.metadata.maturin]
name = "hypern"
python-source = "hypern"
